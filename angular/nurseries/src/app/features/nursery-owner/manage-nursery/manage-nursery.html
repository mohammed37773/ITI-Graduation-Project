<div class="container my-5">
  <div class="card shadow-sm p-4">
    <h2 class="text-center mb-4 text-success-custom fw-bold">
      {{ isEditMode() ? 'تعديل بيانات الحاضنة الطبية' : 'تسجيل حاضنة جديدة' }}
    </h2>

    <div *ngIf="isLoading()" class="text-center my-5">
      <div class="spinner-border text-success-custom" role="status">
        <span class="visually-hidden">جاري التحميل...</span>
      </div>
      <p class="mt-2 text-muted">جاري تحميل البيانات...</p>
    </div>

    <form *ngIf="!isLoading()" [formGroup]="nurseryForm" (ngSubmit)="onSubmit()">
      <div class="row text-end" dir="rtl">
        
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">اسم الحضانة / المركز <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name" placeholder="أدخل الاسم">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">السعر اليومي (جنيه) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="dailyPrice" min="1">
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label fw-bold">وصف المركز والخدمات الطبية والتجهيزات <span class="text-danger">*</span></label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="تكلم عن الرعاية والتجهيزات..."></textarea>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحد الأدنى للسن (بالأيام/الشهور) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="ageRangeMin" min="0">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحد الأقصى للسن <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="ageRangeMax" min="1">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">القدرة الاستيعابية للحواضن <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="capacity" min="1">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">العنوان بالتفصيل <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="address" placeholder="اسم الشارع / رقم المبنى">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">المدينة <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="city" placeholder="مثال: القاهرة">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحي / المنطقة <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="district" placeholder="مثال: المعادي">
        </div>

        <div class="col-12 mb-4 mt-3">
          <label class="form-label fw-bold d-block text-success-custom">📍 حدد موقع الحاضنة بدقة على الخريطة</label>
          <p class="text-muted small">اضغط على موقع مركزك على الخريطة وسيتم ملء خطوط الطول والعرض تلقائياً.</p>
          
          <div class="rounded-4 overflow-hidden shadow-sm border">
            <div id="map" class="w-100"></div>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">خط العرض (Latitude)</label>
          <input type="number" step="any" class="form-control text-start bg-light" formControlName="latitude" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">خط الطول (Longitude)</label>
          <input type="number" step="any" class="form-control text-start bg-light" formControlName="longitude" readonly>
        </div>

        <div class="col-md-12 mb-4 mt-2">
          <label class="form-label fw-bold mb-2 d-block">صور الحضانة والتجهيزات الطبية</label>
          <div class="upload-zone p-4 text-center">
            <input type="file" class="file-input" multiple (change)="onFileChange($event)" accept="image/*">
            <span class="text-muted fw-semibold">اضغط هنا أو اسحب الصور لرفعها</span>
          </div>
          
          <div *ngIf="imagePreviews.length > 0" class="d-flex flex-wrap gap-3 mt-3 justify-content-end">
            <div *ngFor="let preview of imagePreviews" class="position-relative">
              <img [src]="preview" class="img-preview-box shadow-sm" alt="Preview">
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button type="submit" class="btn btn-success-custom px-5 py-2 btn-lg" [disabled]="isSubmitting()">
          <span *ngIf="isSubmitting()" class="spinner-border spinner-border-sm me-2"></span>
          {{ isEditMode() ? 'تحديث البيانات' : 'حفظ الحضانة الآن' }}
        </button>
      </div>
    </form>
  </div>
</div>
<script>
    const map = L.map('map').setView([30.0444, 31.2357], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);

        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;

        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(map);
        }
    });
</script>
