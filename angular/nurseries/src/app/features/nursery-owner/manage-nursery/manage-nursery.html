<div class="container my-5">
  <div class="card shadow-sm p-4">
    <h2 class="text-center mb-4 text-success-custom fw-bold">
      {{ isEditMode() ? 'تعديل بيانات الحاضنة الطبية' : 'تسجيل حاضنة جديدة' }}
    </h2>

    <div *ngIf="isLoading()" class="text-center my-5">
      <div class="spinner-border text-success-custom" role="status">
        <span class="visually-hidden">جاري التحميل...</span>
      </div>
      <p class="mt-2 text-muted">جاري تحميل البيانات...</p>
    </div>

    <form *ngIf="!isLoading()" [formGroup]="nurseryForm" (ngSubmit)="onSubmit()" class="text-end" dir="rtl">
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">اسم الحضانة / المركز <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name" placeholder="أدخل اسم المركز">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">السعر اليومي (ج.م) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="dailyPrice" min="1" placeholder="0">
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label fw-bold">وصف المركز والخدمات الطبية والتجهيزات <span class="text-danger">*</span></label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="تكلم عن مستوى الرعاية الطبية، التمريض، والتجهيزات المتوفرة داخل غرف الحواضن..."></textarea>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحد الأدنى للسن (بالأيام) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="ageRangeMin" min="0" placeholder="0">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحد الأقصى للسن <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="ageRangeMax" min="1" placeholder="1">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">القدرة الاستيعابية للحواضن <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="capacity" min="1" placeholder="1">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">العنوان بالتفصيل <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="address" placeholder="اسم الشارع / رقم المبنى">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">المدينة <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="city" placeholder="مثال: القاهرة">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">الحي / المنطقة <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="district" placeholder="مثال: المعادي">
        </div>

        <hr class="my-4 text-muted opacity-25">

        <div class="col-12 mb-3">
          <label class="form-label fw-bold text-success-custom fs-5">📍 الموقع الجغرافي للحاضنة على الخريطة</label>
          <p class="text-muted small mb-3">قم بالضغط على موقع مركزك بدقة على الخريطة أو اسحب المؤشر وسيتم ملء حقول الإحداثيات تلقائياً.</p>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold text-secondary">خط العرض (Latitude)</label>
          <input type="number" step="any" class="form-control text-start bg-light fw-semibold" formControlName="latitude" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold text-secondary">خط الطول (Longitude)</label>
          <input type="number" step="any" class="form-control text-start bg-light fw-semibold" formControlName="longitude" readonly>
        </div>

        <div class="col-12 mb-3">
          <div #mapContainer id="map" style="height: 380px; border-radius: 12px; border: 1px solid #e2e8f0;" class="shadow-sm"></div>
        </div>

        <div *ngIf="status" class="col-12 mb-3 text-start small text-info fw-semibold">
          {{ status }}
        </div>

        <hr class="my-4 text-muted opacity-25">

        <div class="col-md-12 mb-4">
          <label class="form-label fw-bold mb-2">صور الحضانة والتجهيزات الطبية والشهادات</label>
          <div class="upload-zone p-4 text-center border border-dashed rounded-3 bg-light position-relative">
            <input type="file" class="file-input position-absolute top-0 start-0 w-100 h-100 opacity-0" style="cursor: pointer;" multiple (change)="onFileChange($event)" accept="image/*">
            <span class="text-muted fw-semibold d-block">اضغط هنا أو اسحب الصور لرفعها مباشرة</span>
            <span class="text-muted small">(يمكنك اختيار أكثر من صورة معاً)</span>
          </div>

          <div *ngIf="imagePreviews.length > 0" class="d-flex flex-wrap gap-3 mt-3 justify-content-start">
            <div *ngFor="let preview of imagePreviews" class="position-relative">
              <img [src]="preview" class="img-preview-box shadow-sm rounded border" style="width: 100px; height: 100px; object-fit: cover;" alt="Preview">
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button type="submit" class="btn btn-success-custom px-5 py-2 btn-lg fw-bold shadow-sm" [disabled]="isSubmitting()">
          <span *ngIf="isSubmitting()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ isEditMode() ? 'تحديث البيانات الحالية' : 'حفظ وتسجيل الحضانة الآن' }}
        </button>
      </div>

    </form>
  </div>
</div>
