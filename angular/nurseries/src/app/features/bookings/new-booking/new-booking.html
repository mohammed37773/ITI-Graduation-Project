<div class="container my-5" dir="rtl">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border-0 shadow rounded-4 overflow-hidden bg-white">
        <div class="card-header bg-primary text-white p-4 text-center">
          <h3 class="fw-bold mb-1">طلب التحاق بـ {{ nurseryName() }} 🏫</h3>
          <p class="mb-0 opacity-75 small">أنت تقوم بتقديم طلب حجز مباشر لايف بالسيرفر</p>
        </div>
        <div class="card-body p-4">
          @if (isSubmitted()) {
            <div class="alert alert-success border-0 rounded-3 text-center py-3 mb-4">
              <h5 class="fw-bold mb-1">🎉 تم إرسال طلب الحجز بنجاح!</h5>
              <p class="small mb-0 text-muted">جاري الانتقال إلى لوحة الحجوزات...</p>
            </div>
          }
          @if (errorMessage()) {
            <div class="alert alert-danger border-0 rounded-3 mb-4">
              <strong>⚠️ تنبيه:</strong> {{ errorMessage() }}
            </div>
          }
          <form [formGroup]="bookingForm" (ngSubmit)="onSubmitBooking()">
            <div class="mb-3">
              <label class="form-label fw-semibold">اختر الطفل المراد تسجيله</label>
              <div class="input-group">
                <span class="input-group-text bg-white">👶</span>
                <select formControlName="childId" class="form-select" [ngClass]="{'is-invalid': bookingForm.get('childId')?.touched && bookingForm.get('childId')?.invalid}">
                  <option value="" disabled selected>-- اختر طفلاً من القائمة --</option>
                  @for (child of myChildren(); track child.id) {
                    <option [value]="child.id">{{ child.name }}</option>
                  }
                </select>
                <div class="invalid-feedback">يرجى اختيار اسم الطفل من القائمة.</div>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">تاريخ بدء حضور الطفل</label>
              <div class="input-group">
                <span class="input-group-text bg-white">📅</span>
                <input type="date" formControlName="startDate" class="form-control" [ngClass]="{'is-invalid': bookingForm.get('startDate')?.touched && bookingForm.get('startDate')?.invalid}">
                <div class="invalid-feedback">تحديد تاريخ البداية مطلوب.</div>
              </div>
            </div>
            <button type="submit" [disabled]="bookingForm.invalid || isLoading() || isSubmitted() || myChildren().length === 0" class="btn btn-primary btn-lg w-100 py-2.5 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
              @if (isLoading()) {
                <span class="spinner-border spinner-border-sm"></span> جاري الإرسال للـ DB...
              } @else {
                ✅ تأكيد وإرسال طلب الحجز
              }
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
