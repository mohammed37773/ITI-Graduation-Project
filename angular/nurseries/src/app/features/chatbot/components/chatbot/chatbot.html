<div class="chatbot-container" dir="rtl">
  <div class="chat-header">
    <div class="bot-info">
      <div class="bot-avatar">🤖</div>
      <div class="bot-details">
        <h4>المساعد الذكي لشبكة الحضانات</h4>
        <p class="status">
          <span class="status-dot"></span> متصل الآن ومستعد لمساعدتك
        </p>
      </div>
    </div>
    
    <button type="button" class="btn-clear" (click)="onClearChat()" [disabled]="messages().length === 0 || isLoading()">
      مسح المحادثة 🗑️
    </button>
  </div>

  <div class="chat-messages">
    @for (msg of messages(); track msg.timestamp) {
      <div class="message-wrapper" [ngClass]="msg.sender === 'user' ? 'user-style' : 'ai-style'">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
        <div class="message-time">
          {{ msg.timestamp | date:'shortTime' }}
        </div>
      </div>
    }

    @if (isLoading()) {
      <div class="message-wrapper ai-style">
        <div class="message-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    }
  </div>

  <form [formGroup]="chatForm" (ngSubmit)="onSendMessage()" class="chat-input-area">
    <input 
      type="text" 
      formControlName="message" 
      placeholder="اسأل الذكاء الاصطناعي عن أي شيء يخص الحضانات..."
      (keydown.enter)="$event.preventDefault(); onSendMessage()">
    
    <button type="submit" class="btn-send" [disabled]="chatForm.invalid || isLoading()">
      إرسال 🚀
    </button>
  </form>
</div>
