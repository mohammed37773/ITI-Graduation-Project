<div class="container my-5" dir="rtl">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      
      <div class="card auth-card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-success text-white p-4 text-center border-0">
          <h3 class="fw-bold mb-1">تسجيل الدخول 🔐</h3>
          <p class="mb-0 opacity-75">مرحباً بك مجدداً، سجل دخولك لمتابعة شؤون أطفالك</p>
        </div>

        <div class="card-body p-4">
          
          @if (errorMessage()) {
            <div class="alert alert-danger rounded-3 fs-6 p-2.5 mb-3" role="alert">
              ⚠️ {{ errorMessage() }}
            </div>
          }

          <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
            
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold text-dark">البريد الإلكتروني</label>
              <input 
                type="email" id="email" formControlName="email" 
                class="form-control py-2.5 rounded-3 text-start" 
                [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
                placeholder="name@example.com">
              <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صحيح.</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold text-dark">كلمة المرور</label>
              <input 
                type="password" id="password" formControlName="password" 
                class="form-control py-2.5 rounded-3 text-start" 
                [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
                placeholder="••••••••">
              <div class="invalid-feedback">يرجى إدخال كلمة المرور (6 أحرف على الأقل).</div>
            </div>

            <button 
              type="submit" 
              class="btn btn-success btn-lg w-100 py-2.5 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2"
              [disabled]="loginForm.invalid || isLoading()">
              @if (isLoading()) {
                <span class="spinner-border spinner-border-sm" role="status"></span>
                جاري تسجيل الدخول...
              } @else {
                تسجيل الدخول 🚀
              }
            </button>

            <div class="text-center mt-4">
              <span class="text-muted">ليس لديك حساب؟ </span>
              <a routerLink="/auth/register" class="text-success fw-bold text-decoration-none">إنشاء حساب جديد</a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
