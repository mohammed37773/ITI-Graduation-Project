<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">👶</span>
        <h2>Welcome Back</h2>
      </div>
      <p>Log in to access your saved nurseries and AI recommendations</p>
    </div>

    <!-- Form -->
    <form [formGroup].="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="name@example.com"
            [class.error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          />
        </div>
      </div>

      <!-- Remember Me & Checkbox -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe" />
          <span class="checkmark"></span>
          Remember this device for 30 days
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">
        Log In →
      </button>

      <!-- Divider -->
      <div class="divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-buttons">
        <button type="button" class="btn-social google">
          <img src="assets/icons/google.svg" alt="" /> Sign in with Google
        </button>
        <button type="button" class="btn-social facebook">
          <img src="assets/icons/facebook.svg" alt="" /> Sign in with Facebook
        </button>
      </div>
    </form>

    <!-- Footer Link -->
    <div class="auth-footer">
      <p>New to Nursery Finder? <a routerLink="/auth/register">Create an account</a></p>
    </div>
  </div>
</div>
