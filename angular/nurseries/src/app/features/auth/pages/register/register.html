<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">👶</span>
        <h2>Join our community</h2>
      </div>
      <p>Find the perfect start for your little one's journey</p>
    </div>

    <!-- Social Registration First (As shown in wireframe) -->
    <div class="social-buttons-top">
      <button type="button" class="btn-social google">
        <img src="gmail.png" alt="" /> Continue with Google
      </button>
    </div>

    <div class="divider">
      <span>OR REGISTER WITH EMAIL</span>
    </div>

    <!-- Form -->
    <form [formGroup].="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="fullName" formControlName="fullName" placeholder="Jane Doe" />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" formControlName="email" placeholder="jane@example.com" />
        </div>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <div class="input-wrapper">
          <span class="input-icon">📞</span>
          <input type="text" id="phoneNumber" formControlName="phoneNumber" placeholder="+1 (555) 000-0000" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" formControlName="password" placeholder="At least 8 characters with numbers" />
        </div>
      </div>

      <!-- Role Selection (الميزة الجديدة لـ Role-Based) -->
      <div class="form-group">
        <label for="role">Account Type</label>
        <div class="input-wrapper">
          <span class="input-icon">🎭</span>
          <select id="role" formControlName="role" class="select-role">
            <option value="Parent">Parent (Looking for a nursery)</option>
            <option value="NurseryOwner">Nursery Owner (Managing a nursery)</option>
          </select>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" required />
          <span class="checkmark"></span>
          I agree to the Terms of Service and Privacy Policy.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="registerForm.invalid" class="btn-submit">
        Create Account >
      </button>
    </form>

    <!-- Footer Link -->
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/auth/login">Log in</a></p>
    </div>
  </div>
</div>
