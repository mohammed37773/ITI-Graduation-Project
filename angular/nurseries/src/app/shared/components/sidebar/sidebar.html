<aside class="sidebar" [class.collapsed]="collapsed">

  <a class="admin-brand" routerLink="/">
    <div class="admin-logo">
      <svg viewBox="0 0 42 42" class="admin-logo-svg" aria-hidden="true">
        <rect x="2" y="2" width="38" height="38" rx="11" fill="url(#adminGrad)"/>
        <path d="M21 9l10 4v7c0 6.5-4.3 11-10 13-5.7-2-10-6.5-10-13v-7l10-4z"
              fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
        <path d="M17 21.5l3 3 6-6.5" stroke="#7B7FF2" stroke-width="2.2"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#262A38"/>
            <stop offset="100%" stop-color="#1A1D27"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="logo-text d-flex flex-column text-start" *ngIf="!collapsed">
      <span class="brand-name fw-bold">IncuCare</span>
      <span class="brand-slogan small opacity-75">لوحة تحكم النظام</span>
    </div>
  </a>

  <nav class="sidebar-nav">
    <div class="nav-section-label" *ngIf="!collapsed">القائمة الرئيسية</div>
    
    <!-- تم إضافة وسم البداية <a هنا -->
    <a 
      *ngFor="let item of navItems; let i = index"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [style.animation-delay.ms]="i * 45"
      [title]="collapsed ? item.label : ''"
    >
      <span class="nav-icon"><i class="bi" [class]="item.icon"></i></span>
      <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar-footer" *ngIf="!collapsed">
    <div class="user-info">
      <img
        src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=80&h=80&dpr=1"
        alt="المسؤول"
        class="avatar avatar-sm"
      />
      <div class="user-meta">
        <p class="user-name">مسؤول النظام</p>
        <p class="user-role">مسؤول رئيسي</p>
      </div>
    </div>
    <a href="#" class="logout-btn" (click)="onLogout()">
      <i class="bi bi-box-arrow-left"></i>
      <span>تسجيل الخروج</span>
    </a>
  </div>

  <div class="sidebar-footer-collapsed" *ngIf="collapsed">
    <a href="#" class="logout-icon" (click)="onLogout()" title="تسجيل الخروج">
      <i class="bi bi-box-arrow-left"></i>
    </a>
  </div>
</aside>
